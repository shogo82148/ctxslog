name: reviewdog

on:
  pull_request: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1
      - uses: reviewdog/action-golangci-lint@v2.10.2
        with:
          github_token: ${{ secrets.github_token }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1
      - uses: reviewdog/action-actionlint@v1.80.8
        with:
          github_token: ${{ secrets.github_token }}
